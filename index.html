<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>🐟 Bubulle Snake</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>🐟 Bubulle Snake</h1>

<p>
Aide Bubulle à manger les algues 🌿
</p>




<div class="score">

<span id="score">
Algues : 0
</span>

</div>





<canvas id="game"></canvas>







<!-- CONTROLES TELEPHONE -->

<div class="buttons">


<button id="up">
⬆️
</button>



<div>

<button id="left">
⬅️
</button>


<button id="down">
⬇️
</button>


<button id="right">
➡️
</button>


</div>


</div>









<!-- FIN DE PARTIE -->


<div id="gameOver" style="display:none;">


<h2>🌊 Bubulle est fatigué...</h2>


<p id="finalScore">
</p>


<button id="restartBtn">
Rejouer 🐠
</button>


<button id="rankingBtn">
🏆 Classement
</button>


</div>









<!-- CLASSEMENT -->


<div id="ranking" style="display:none;">


<h2>🏆 Classement des meilleurs joueurs</h2>


<ol id="rankingList">

</ol>



<button id="closeRanking">

Fermer

</button>


</div>









<!-- FIREBASE -->


<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { 

getFirestore,
collection,
addDoc,
query,
orderBy,
limit,
getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";





const firebaseConfig = {


apiKey: "TON_API_KEY",

authDomain: "TON_AUTH_DOMAIN",

projectId: "TON_PROJECT_ID",

storageBucket: "TON_STORAGE_BUCKET",

messagingSenderId: "TON_MESSAGING_SENDER_ID",

appId: "TON_APP_ID"


};






const app = initializeApp(firebaseConfig);


const db = getFirestore(app);





// rendre Firebase accessible au script.js


window.db = db;

window.collection = collection;

window.addDoc = addDoc;

window.query = query;

window.orderBy = orderBy;

window.limit = limit;

window.getDocs = getDocs;



</script>









<!-- SCRIPT DU JEU -->


<script src="script.js"></script>



</body>

</html>
