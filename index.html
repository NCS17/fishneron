<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐟 Henneron's Fish</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>🐟 Henneron's Fish</h1>


<p>
Aide ton poisson à manger les algues 🌿
</p>





<div class="score">

<span id="score">
Algues : 0
</span>

</div>





<!-- CASIER AVANT PARTIE -->

<div id="locker">


<h2>
🧰 Casier à poissons
</h2>


<p>
Choisis ton Bubulle :
</p>




<div class="skins">



<div class="skinCard">

<img src="./fishImages/rouge.png">

<button onclick="equipSkin('rouge')">
🐟 Classique
</button>

</div>





<div class="skinCard">

<img src="./fishImages/nemo.png">

<button onclick="equipSkin('nemo')">
🐠 Tropical
</button>

</div>






<div class="skinCard">

<img src="./fishImages/ballon.png">

<button onclick="equipSkin('ballon')">
🐡 Ballon
</button>

</div>






<div class="skinCard">

<img src="./fishImages/requin.png">

<button onclick="equipSkin('requin')">
🦈 Requin
</button>

</div>






<div class="skinCard">

<img src="./fishImages/whale.png">

<button onclick="equipSkin('whale')">
🐋 Baleine
</button>

</div>






<div class="skinCard">

<img src="./fishImages/octo.png">

<button onclick="equipSkin('octo')">
🐙 Poulpe
</button>

</div>



</div>


</div>










<!-- JEU -->


<div class="gameContainer">


<canvas id="game"></canvas>





<!-- GAME OVER -->


<div id="gameOver" style="display:none;">


<h2>
🦈 GAME OVER !
</h2>



<p id="finalScore">

</p>



<button id="restartBtn">

🐟 Rejouer

</button>



<button id="rankingBtn">

🏆 Classement

</button>



</div>


</div>









<!-- CONTROLES -->


<div class="buttons">


<button id="up">
⬆️
</button>



<div>

<button id="left">
⬅️
</button>


<button id="down">
⬇️
</button>


<button id="right">
➡️
</button>


</div>


</div>










<!-- CLASSEMENT -->


<div id="ranking" style="display:none;">


<h2>
🏆 Classement
</h2>



<ol id="rankingList">

<li>
Chargement...
</li>

</ol>




<button id="refreshRanking">

🔄 Actualiser

</button>




<button onclick="document.getElementById('ranking').style.display='none'">

Fermer

</button>



</div>









<!-- FIREBASE -->


<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getFirestore,

collection,

addDoc,

query,

orderBy,

limit,

getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";







const firebaseConfig = {


apiKey: "AIzaSyBvcKnfsjvwvAjkfZ-mysvUartZSm3GK3E",


authDomain: "henneron-s-fish.firebaseapp.com",


projectId: "henneron-s-fish",


storageBucket: "henneron-s-fish.firebasestorage.app",


messagingSenderId: "126418087769",


appId: "1:126418087769:web:f1c68acad749ab5299a648"


};







const app = initializeApp(firebaseConfig);



const db = getFirestore(app);





window.db=db;

window.collection=collection;

window.addDoc=addDoc;

window.query=query;

window.orderBy=orderBy;

window.limit=limit;

window.getDocs=getDocs;



</script>






<script src="script.js"></script>



</body>

</html>
